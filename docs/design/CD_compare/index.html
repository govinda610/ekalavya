<style>
:root{
  /* ---- Palette anchors ---- */

.wrap{max-width:1220px;margin:0 auto;padding:0 26px}

}

/* =========================================================
   HERO
========================================================= */
.hero{min-height:min(92vh,860px);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative;overflow:hidden;padding:120px 26px 90px}
.hero-mandala{position:absolute;top:50%;left:50%;width:min(1080px,150vw);height:min(1080px,150vw);transform:translate(-50%,-50%);opacity:.16;pointer-events:none}
.hero-mandala .spin{transform-origin:center;animation:slowspin 120s linear infinite}
@keyframes slowspin{to{transform:rotate(360deg)}}
.hero-forest{position:absolute;bottom:0;left:0;right:0;height:38%;pointer-events:none;opacity:.85}
.hero-glow{position:absolute;bottom:6%;left:50%;transform:translateX(-50%);width:520px;height:320px;background:radial-gradient(ellipse at bottom,rgba(231,182,75,.22),transparent 70%);pointer-events:none;filter:blur(2px)}
.hero-inner{position:relative;z-index:2;max-width:900px}
.hero-tag{font-family:var(--f-mono);font-size:12px;letter-spacing:.5em;text-transform:uppercase;color:var(--peacock-bright);margin-bottom:26px}
.wordmark{display:flex;align-items:center;justify-content:center;gap:24px;margin-bottom:8px}
.wordmark svg{filter:drop-shadow(0 4px 18px rgba(231,182,75,.35))}
h1.eka{
  font-family:var(--f-display);font-weight:900;font-size:clamp(52px,10vw,120px);line-height:.92;margin:0;
  letter-spacing:.04em;
  color:transparent;
  background:linear-gradient(180deg,#fff6df 0%,var(--gold-bright) 30%,var(--gold) 55%,var(--gold-deep) 100%);

  text-shadow:0 2px 30px rgba(231,182,75,.25);
  position:relative;
}
.eka-deva{font-family:var(--f-deva);font-size:clamp(24px,4vw,40px);color:var(--parch);opacity:.9;margin:14px 0 0;letter-spacing:.02em}
.hero-sub{font-family:var(--f-serif);font-style:italic;font-size:clamp(18px,2.4vw,26px);color:var(--parch-dim);margin:26px auto 0;max-width:620px;line-height:1.5}
.hero-sub b{color:var(--gold-bright);font-style:normal;font-weight:600}
.hero-meta{margin-top:44px;display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--parch-dim)}

========================================================= */

.swatch .name{font-family:var(--f-title);font-size:16px;color:var(--parch)}

.rationale .r{padding:20px 22px}

.rationale p{margin:0;font-size:15px;color:var(--parch-dim)}

/* =========================================================
   TYPE
========================================================= */
.type-stack{display:grid;gap:16px}
.spec{padding:26px 30px}
.spec .lbl{font-family:var(--f-mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--peacock-bright);margin-bottom:14px}
.d-cinzel{font-family:var(--f-display);font-weight:800;font-size:clamp(34px,6vw,66px);line-height:1;letter-spacing:.02em;color:var(--parch);text-shadow:0 2px 0 rgba(0,0,0,.5)}
.d-marcellus{font-family:var(--f-title);font-size:clamp(26px,4vw,40px);color:var(--gold-bright);line-height:1.15}
.d-deva{font-family:var(--f-deva);font-size:clamp(30px,5vw,52px);color:var(--parch);line-height:1.3}
.d-deva small{display:block;font-family:var(--f-mono);font-size:12px;color:var(--parch-dim);letter-spacing:.1em;margin-top:8px}
.d-body{font-family:var(--f-body);font-size:18px;color:var(--parch-dim);max-width:660px}

.numerals{font-family:var(--f-display);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.04em;font-size:clamp(40px,7vw,74px);
  color:transparent;background:linear-gradient(180deg,#fff6df,var(--gold) 60%,var(--gold-deep));-webkit-background-clip:text;background-clip:text;text-shadow:0 3px 20px rgba(231,182,75,.3)}
.type-scale{display:flex;gap:24px;flex-wrap:wrap;margin-top:18px;align-items:baseline}
.type-scale div{font-family:var(--f-display);color:var(--parch)}

/* =========================================================
   COMPONENTS
========================================================= */
.comp-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:18px;align-items:start}
.card{padding:24px}
.card.span4{grid-column:span 4}.card.span6{grid-column:span 6}.card.span8{grid-column:span 8}.card.span12{grid-column:span 12}
.card .kicker{font-family:var(--f-mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--peacock-bright);margin-bottom:14px;display:flex;align-items:center;gap:9px}

/* buttons */
.btn{font-family:var(--f-title);font-size:15px;letter-spacing:.06em;padding:13px 26px;border-radius:3px;border:1px solid transparent;cursor:pointer;display:inline-flex;align-items:center;gap:10px;transition:.22s;position:relative;text-decoration:none}
.btn-gold{background:linear-gradient(180deg,var(--gold-bright),var(--gold) 55%,var(--gold-deep));color:#2a1c07;box-shadow:0 6px 20px -6px rgba(231,182,75,.55),inset 0 1px 0 rgba(255,255,255,.4);font-weight:600}
.btn-gold:hover{transform:translateY(-2px);box-shadow:0 12px 28px -8px rgba(231,182,75,.7),inset 0 1px 0 rgba(255,255,255,.5)}
.btn-stone{background:linear-gradient(180deg,var(--stone-warm),var(--stone-dark));color:var(--parch);border:1px solid var(--line-gold);box-shadow:var(--sh-carve)}
.btn-stone:hover{border-color:var(--gold);color:var(--gold-bright)}
.btn-ghost{background:transparent;border:1px solid var(--line-gold);color:var(--parch-dim)}
.btn-ghost:hover{color:var(--gold-bright);border-color:var(--gold)}
.btn-danger{background:linear-gradient(180deg,var(--vermilion),var(--vermilion-deep));color:#ffe9e3;box-shadow:0 6px 18px -6px rgba(214,59,42,.6)}
.btn-row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

/* inputs */
.inp{width:100%;background:rgba(4,6,15,.6);border:1px solid var(--line-gold);border-radius:3px;padding:13px 15px;color:var(--parch);font-family:var(--f-body);font-size:15px;outline:none;transition:.2s}
.inp:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(231,182,75,.14)}
.inp::placeholder{color:var(--parch-dim);opacity:.6}
.field-lbl{font-family:var(--f-mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--parch-dim);margin:0 0 7px;display:block}

/* pills / tags */
.pill{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;padding:5px 12px;border-radius:20px;border:1px solid var(--line-gold);color:var(--parch-dim);display:inline-flex;gap:7px;align-items:center}
.pill.teal{border-color:rgba(46,163,160,.5);color:var(--peacock-bright);background:rgba(18,77,76,.25)}
.pill.gold{border-color:var(--gold);color:var(--gold-bright);background:rgba(231,182,75,.1)}
.pill.verm{border-color:rgba(214,59,42,.5);color:var(--vermilion-glow);background:rgba(143,35,24,.2)}

/* quest banner */
.quest{padding:0;overflow:hidden;position:relative}
.quest .qbody{display:flex;gap:22px;align-items:center;padding:24px 28px 24px 26px}
.quest .qseal{flex:0 0 auto}
.quest .qtxt{flex:1}
.quest .qeye{font-family:var(--f-mono);font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--vermilion-glow);margin-bottom:6px}
.quest .qtitle{font-family:var(--f-display);font-weight:700;font-size:24px;color:var(--parch);line-height:1.1}
.quest .qdesc{font-family:var(--f-serif);font-style:italic;font-size:16px;color:var(--parch-dim);margin-top:5px}
.quest .qside{flex:0 0 auto;text-align:right}
.quest .qreward{font-family:var(--f-display);font-weight:700;font-size:22px;color:var(--gold);font-variant-numeric:tabular-nums}
.quest .qrewlbl{font-family:var(--f-mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--parch-dim)}

/* mandala HUD */
.hud{padding:22px 24px;display:flex;gap:22px;align-items:center}

.hud .medallion .lvlnum .n{font-family:var(--f-display);font-weight:800;font-size:34px;color:var(--gold-bright);line-height:1;text-shadow:0 2px 8px rgba(231,182,75,.4)}
.hud .medallion .lvlnum .t{font-family:var(--f-mono);font-size:8px;letter-spacing:.2em;color:var(--parch-dim);margin-top:2px}
.hud .hinfo{flex:1;min-width:0}
.hud .hname{font-family:var(--f-title);font-size:22px;color:var(--parch);display:flex;align-items:center;gap:10px}
.hud .htitle{font-family:var(--f-serif);font-style:italic;font-size:15px;color:var(--gold-bright);margin:2px 0 12px}
.hud .hstats{display:flex;gap:20px;font-family:var(--f-mono);font-size:11px;color:var(--parch-dim);letter-spacing:.06em;flex-wrap:wrap}
.hud .hstats b{color:var(--gold);font-size:14px}

/* XP bowstring */
.bow-wrap{padding:22px 24px}
.bow-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.bow-head .l{font-family:var(--f-mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--peacock-bright)}
.bow-head .r{font-family:var(--f-display);font-weight:700;font-size:16px;color:var(--gold);font-variant-numeric:tabular-nums}
.bow-svg{width:100%;display:block}
.bow-note{font-family:var(--f-serif);font-style:italic;font-size:14px;color:var(--parch-dim);margin-top:8px}

/* streak */
.streak{display:flex;align-items:center;gap:16px;padding:20px 22px}
.streak .flame{flex:0 0 auto}
.streak .sinfo .n{font-family:var(--f-display);font-weight:800;font-size:40px;color:var(--gold-bright);line-height:1;font-variant-numeric:tabular-nums}
.streak .sinfo .l{font-family:var(--f-mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--parch-dim)}
.streak .combo{margin-left:auto;text-align:right}
.streak .combo .c{font-family:var(--f-display);font-weight:700;font-size:22px;color:var(--vermilion-glow)}
.streak .combo .cl{font-family:var(--f-mono);font-size:9px;letter-spacing:.16em;color:var(--parch-dim);text-transform:uppercase}

/* achievement toast */
.toast{display:flex;gap:16px;align-items:center;padding:16px 20px;border:1px solid var(--gold);background:linear-gradient(120deg,rgba(35,29,24,.95),rgba(20,15,10,.95));border-radius:5px;box-shadow:0 12px 40px -10px rgba(231,182,75,.4),var(--sh-carve);position:relative;overflow:hidden}
.toast::after{content:&quot;&quot;;position:absolute;top:0;left:-40%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,246,223,.25),transparent);animation:sheen 3.2s ease-in-out infinite}
@keyframes sheen{0%,60%{left:-45%}80%,100%{left:130%}}
.toast .badge{flex:0 0 auto}
.toast .tinfo .te{font-family:var(--f-mono);font-size:9px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin-bottom:3px}
.toast .tinfo .tn{font-family:var(--f-display);font-weight:700;font-size:18px;color:var(--parch)}
.toast .tinfo .td{font-family:var(--f-serif);font-style:italic;font-size:14px;color:var(--parch-dim)}

/* level up ceremony */
.ceremony{position:relative;min-height:340px;border-radius:6px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at center,rgba(30,24,14,.9),var(--indigo-abyss) 70%);border:1px solid var(--gold)}
.ceremony .cbg{position:absolute;inset:0;pointer-events:none}
.ceremony .rays{position:absolute;top:50%;left:50%;width:640px;height:640px;transform:translate(-50%,-50%);opacity:.6;animation:slowspin 40s linear infinite}
.ceremony .ccontent{position:relative;text-align:center;z-index:2}
.ceremony .bloom{animation:bloom 1.5s cubic-bezier(.2,.7,.3,1) both}
@keyframes bloom{0%{transform:scale(.4);opacity:0;filter:blur(6px)}55%{transform:scale(1.08)}100%{transform:scale(1);opacity:1;filter:blur(0)}}
.ceremony .ce{font-family:var(--f-mono);font-size:11px;letter-spacing:.4em;text-transform:uppercase;color:var(--peacock-bright);margin-bottom:8px}
.ceremony .clvl{font-family:var(--f-display);font-weight:900;font-size:64px;line-height:1;color:transparent;background:linear-gradient(180deg,#fff6df,var(--gold) 55%,var(--gold-deep));-webkit-background-clip:text;background-clip:text;text-shadow:0 4px 30px rgba(231,182,75,.5)}
.ceremony .ctitle{font-family:var(--f-serif);font-style:italic;font-size:22px;color:var(--parch);margin-top:10px}
.ceremony .ctitle b{color:var(--gold-bright);font-style:normal}
.diya{position:absolute;bottom:26px;filter:drop-shadow(0 0 14px rgba(231,182,75,.7))}
.diya.d1{left:16%}.diya.d2{right:16%}.diya .fl{animation:flick 1.4s ease-in-out infinite}
@keyframes flick{0%,100%{transform:scaleY(1) translateY(0);opacity:1}50%{transform:scaleY(1.12) translateY(-1px);opacity:.85}}

/* loss screen */
.loss{position:relative;min-height:360px;border-radius:6px;overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center;
  background:radial-gradient(circle at center,rgba(60,14,10,.55),var(--indigo-abyss) 72%);border:1px solid var(--vermilion-deep)}
.loss .cracks{position:absolute;inset:0;pointer-events:none;opacity:.5}
.loss .lcontent{position:relative;z-index:2;padding:20px}
.loss .le{font-family:var(--f-mono);font-size:11px;letter-spacing:.4em;text-transform:uppercase;color:var(--vermilion-glow);margin-bottom:12px}
.loss .lbig{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,5vw,52px);line-height:1.05;color:transparent;
  background:linear-gradient(180deg,#ffb9ac,var(--vermilion) 60%,var(--vermilion-deep));-webkit-background-clip:text;background-clip:text;
  text-shadow:0 2px 24px rgba(214,59,42,.4);letter-spacing:.02em}
.loss .lsub{font-family:var(--f-serif);font-style:italic;font-size:18px;color:var(--parch-dim);margin:16px auto 0;max-width:440px}
.loss .lmerit{margin-top:24px;display:inline-flex;align-items:center;gap:12px;padding:12px 22px;border:1px solid var(--gold);border-radius:4px;background:rgba(231,182,75,.08)}
.loss .lmerit .mn{font-family:var(--f-display);font-weight:700;font-size:20px;color:var(--gold-bright)}
.loss .lmerit .ml{font-family:var(--f-mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--parch-dim)}
.loss .lmerit .deva{font-family:var(--f-deva);font-size:18px;color:var(--gold)}

/* empty state */
.empty{text-align:center;padding:40px 24px}
.empty svg{margin-bottom:16px;opacity:.8}
.empty .et{font-family:var(--f-display);font-weight:600;font-size:22px;color:var(--parch)}
.empty .ed{font-family:var(--f-serif);font-style:italic;font-size:16px;color:var(--parch-dim);margin:8px auto 18px;max-width:360px}

/* =========================================================
   MANDALA SKILL TREE
========================================================= */
.tree-wrap{display:grid;grid-template-columns:1.15fr .85fr;gap:22px;align-items:stretch}
.mandala-stage{padding:20px;display:flex;align-items:center;justify-content:center;min-height:560px;position:relative;overflow:hidden}
.mandala-stage svg{width:100%;height:auto;max-width:560px}
.petal{cursor:pointer;transition:.25s}
.petal:hover{filter:brightness(1.25) drop-shadow(0 0 10px rgba(231,182,75,.5))}
.track-panel{padding:24px 26px;display:flex;flex-direction:column}
.track-panel .tp-eye{font-family:var(--f-mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--peacock-bright)}
.track-panel .tp-title{font-family:var(--f-display);font-weight:700;font-size:26px;color:var(--parch);margin:4px 0 2px}
.track-panel .tp-deva{font-family:var(--f-deva);font-size:17px;color:var(--gold-bright);margin-bottom:14px}
.track-line{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--line-soft)}
.track-line:last-child{border-bottom:0}
.node-dot{flex:0 0 auto;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative}
.node-dot.done{background:radial-gradient(circle,var(--gold-bright),var(--gold-deep));box-shadow:0 0 14px rgba(231,182,75,.5),inset 0 1px 0 rgba(255,255,255,.4)}
.node-dot.active{background:radial-gradient(circle,rgba(46,163,160,.5),rgba(18,77,76,.7));border:1.5px solid var(--peacock-bright);box-shadow:0 0 14px rgba(46,163,160,.5)}
.node-dot.locked{background:var(--stone-dark);border:1px solid var(--line-soft);opacity:.7}
.tl-info{flex:1;min-width:0}
.tl-name{font-family:var(--f-title);font-size:16px;color:var(--parch)}
.tl-name.lock{color:var(--parch-dim)}
.tl-meta{font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;color:var(--parch-dim)}
.tl-xp{font-family:var(--f-display);font-weight:700;font-size:14px;color:var(--gold);font-variant-numeric:tabular-nums}
.legend{display:flex;gap:18px;margin-top:16px;flex-wrap:wrap;font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;color:var(--parch-dim);text-transform:uppercase}
.legend span{display:flex;align-items:center;gap:7px}
.legend i{width:11px;height:11px;border-radius:50%;display:inline-block}

/* =========================================================
   HEATMAP + XP CURVE
========================================================= */
.stat-grid{display:grid;grid-template-columns:1.35fr 1fr;gap:22px}
.heat{padding:24px}
.heat-grid{display:grid;grid-template-columns:repeat(26,1fr);gap:5px;margin-top:16px}
.lamp{aspect-ratio:1;border-radius:2px;position:relative}
.lamp.l0{background:rgba(231,182,75,.06);border:1px solid rgba(231,182,75,.08)}
.lamp.l1{background:rgba(231,182,75,.22)}
.lamp.l2{background:rgba(231,182,75,.42);box-shadow:0 0 4px rgba(231,182,75,.3)}
.lamp.l3{background:rgba(231,182,75,.68);box-shadow:0 0 7px rgba(231,182,75,.5)}
.lamp.l4{background:radial-gradient(circle,var(--gold-bright),var(--gold-deep));box-shadow:0 0 11px rgba(231,182,75,.75)}
.heat-legend{display:flex;align-items:center;gap:8px;justify-content:flex-end;margin-top:14px;font-family:var(--f-mono);font-size:10px;color:var(--parch-dim);letter-spacing:.08em}
.xpcurve{padding:24px}
.big-stat{display:flex;gap:28px;margin-top:8px;flex-wrap:wrap}
.big-stat .bs .v{font-family:var(--f-display);font-weight:700;font-size:30px;color:var(--gold-bright);font-variant-numeric:tabular-nums;line-height:1}
.big-stat .bs .k{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--parch-dim);margin-top:4px}

/* =========================================================
   FULL SCREEN MOCKUPS
========================================================= */
.mock{border-radius:8px;overflow:hidden;border:1px solid var(--line-gold);box-shadow:var(--sh-deep);background:var(--indigo-abyss)}
.mock-bar{display:flex;align-items:center;gap:10px;padding:11px 16px;background:linear-gradient(180deg,var(--stone-warm),var(--stone-dark));border-bottom:1px solid var(--line-gold)}
.mock-bar .dots{display:flex;gap:6px}
.mock-bar .dots i{width:10px;height:10px;border-radius:50%;background:var(--stone)}
.mock-bar .dots i:nth-child(1){background:var(--vermilion)}.mock-bar .dots i:nth-child(2){background:var(--gold)}.mock-bar .dots i:nth-child(3){background:var(--peacock)}
.mock-bar .url{font-family:var(--f-mono);font-size:11px;color:var(--parch-dim);letter-spacing:.05em}

/* practice screen */
.practice{display:grid;grid-template-columns:220px 1fr 320px;min-height:600px;background:
  radial-gradient(600px 400px at 80% 0%,rgba(46,163,160,.06),transparent),
  linear-gradient(180deg,var(--indigo-night),var(--indigo-abyss))}
.p-rail{border-right:1px solid var(--line-soft);padding:20px 16px;display:flex;flex-direction:column;gap:6px;background:rgba(4,6,15,.4)}
.p-logo{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.p-logo .pn{font-family:var(--f-display);font-weight:700;font-size:17px;color:var(--gold-bright);letter-spacing:.06em}
.rail-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:4px;font-family:var(--f-title);font-size:14px;color:var(--parch-dim);cursor:pointer;transition:.18s}
.rail-item:hover{background:rgba(231,182,75,.06);color:var(--parch)}
.rail-item.on{background:linear-gradient(90deg,rgba(231,182,75,.16),transparent);color:var(--gold-bright);border-left:2px solid var(--gold)}
.rail-mini-hud{margin-top:auto;border-top:1px solid var(--line-soft);padding-top:16px}
.p-center{display:flex;flex-direction:column;min-height:0}
.p-chat{flex:1;padding:24px;display:flex;flex-direction:column;gap:16px;overflow:hidden}
.msg{max-width:82%;font-family:var(--f-body);font-size:15px;line-height:1.55}
.msg .who{font-family:var(--f-mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;margin-bottom:6px;color:var(--parch-dim)}
.msg.guru{align-self:flex-start}
.msg.guru .bub{background:linear-gradient(160deg,rgba(35,29,24,.9),rgba(14,12,20,.92));border:1px solid var(--line-gold);border-radius:4px 12px 12px 12px;padding:15px 18px;color:var(--parch);box-shadow:var(--sh-carve)}
.msg.guru .who{color:var(--gold)}
.msg.you{align-self:flex-end;text-align:right}
.msg.you .bub{background:linear-gradient(160deg,rgba(18,77,76,.4),rgba(8,20,20,.6));border:1px solid rgba(46,163,160,.35);border-radius:12px 4px 12px 12px;padding:15px 18px;color:var(--parch);display:inline-block;text-align:left}
.msg.you .who{color:var(--peacock-bright)}
.msg .code{font-family:var(--f-mono);font-size:13px;background:rgba(4,6,15,.7);border:1px solid var(--line-soft);border-radius:4px;padding:12px 14px;margin-top:10px;color:var(--peacock-bright);white-space:pre;overflow-x:auto;line-height:1.5}
.msg .code .kw{color:var(--vermilion-glow)}.msg .code .fn{color:var(--gold)}.msg .code .cm{color:var(--parch-dim)}
.p-input{border-top:1px solid var(--line-soft);padding:16px 24px;display:flex;gap:12px;align-items:center;background:rgba(4,6,15,.5)}
.p-editor{border-left:1px solid var(--line-soft);display:flex;flex-direction:column;background:rgba(4,6,10,.6)}
.ed-head{padding:12px 16px;border-bottom:1px solid var(--line-soft);font-family:var(--f-mono);font-size:11px;color:var(--parch-dim);letter-spacing:.08em;display:flex;justify-content:space-between;align-items:center}
.ed-body{flex:1;padding:16px;font-family:var(--f-mono);font-size:12.5px;line-height:1.7;color:var(--parch);white-space:pre;overflow:auto}
.ed-body .ln{color:var(--parch-dim);opacity:.4;user-select:none;margin-right:14px}
.ed-body .kw{color:var(--vermilion-glow)}.ed-body .fn{color:var(--gold)}.ed-body .st{color:var(--peacock-bright)}.ed-body .cm{color:var(--parch-dim);font-style:italic}
.ed-foot{padding:12px 16px;border-top:1px solid var(--line-soft);display:flex;gap:10px}

/* dashboard screen */
.dash{padding:26px;background:
  radial-gradient(700px 500px at 100% 0,rgba(231,182,75,.05),transparent),
  linear-gradient(180deg,var(--indigo-night),var(--indigo-abyss));min-height:600px}
.dash-top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:20px;flex-wrap:wrap}
.dash-greet .g1{font-family:var(--f-serif);font-style:italic;font-size:16px;color:var(--parch-dim)}
.dash-greet .g2{font-family:var(--f-display);font-weight:700;font-size:30px;color:var(--parch);line-height:1.1}
.dash-cols{display:grid;grid-template-columns:2fr 1fr;gap:18px}
.dash-cell{padding:20px 22px}
.dash-cell .dh{font-family:var(--f-title);font-size:17px;color:var(--gold-bright);margin-bottom:14px;display:flex;align-items:center;gap:9px;justify-content:space-between}
.dash-cell .dh .r{font-family:var(--f-mono);font-size:10px;color:var(--parch-dim);letter-spacing:.1em}
.mini-quest{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line-soft)}
.mini-quest:last-child{border-bottom:0}
.mini-quest .mqi{flex:0 0 auto}
.mini-quest .mqt{flex:1}
.mini-quest .mqn{font-family:var(--f-title);font-size:15px;color:var(--parch)}
.mini-quest .mqd{font-family:var(--f-mono);font-size:10px;color:var(--parch-dim);letter-spacing:.06em}
.mini-quest .mqx{font-family:var(--f-display);font-weight:700;font-size:14px;color:var(--gold)}

/* =========================================================
   MOBILE PREVIEW
========================================================= */
.mobile-row{display:flex;gap:40px;flex-wrap:wrap;justify-content:center;align-items:flex-start}
.phone{width:300px;border-radius:34px;padding:11px;background:linear-gradient(160deg,#2a2018,#0c0a12);border:1px solid var(--line-gold);box-shadow:0 30px 70px -20px rgba(0,0,0,.8),inset 0 1px 0 rgba(231,182,75,.15)}
.phone .notch{width:110px;height:6px;background:#000;border-radius:6px;margin:2px auto 8px}
.screen{border-radius:24px;overflow:hidden;background:linear-gradient(180deg,var(--indigo-night),var(--indigo-abyss));position:relative;min-height:560px;display:flex;flex-direction:column}
.m-status{display:flex;justify-content:space-between;padding:9px 18px 4px;font-family:var(--f-mono);font-size:10px;color:var(--parch-dim)}
.m-hud{padding:12px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line-soft)}
.m-hud .mn{font-family:var(--f-display);font-weight:700;font-size:15px;color:var(--parch)}
.m-hud .mt{font-family:var(--f-serif);font-style:italic;font-size:12px;color:var(--gold-bright)}
.m-body{flex:1;padding:14px;display:flex;flex-direction:column;gap:12px;overflow:hidden}
.m-msg{font-family:var(--f-body);font-size:13px;line-height:1.5}
.m-msg.g .b{background:rgba(35,29,24,.85);border:1px solid var(--line-gold);border-radius:4px 11px 11px 11px;padding:11px 13px;color:var(--parch)}
.m-msg.g .b .code{font-family:var(--f-mono);font-size:11px;background:rgba(4,6,15,.7);padding:8px 10px;border-radius:4px;margin-top:8px;color:var(--peacock-bright);white-space:pre;overflow-x:auto}
.m-msg.y{text-align:right}
.m-msg.y .b{display:inline-block;background:rgba(18,77,76,.4);border:1px solid rgba(46,163,160,.35);border-radius:11px 4px 11px 11px;padding:10px 13px;color:var(--parch);text-align:left}
.m-input{padding:10px 12px;border-top:1px solid var(--line-soft);display:flex;gap:8px;align-items:center}
.m-input .mi{flex:1;background:rgba(4,6,15,.6);border:1px solid var(--line-gold);border-radius:20px;padding:9px 13px;font-family:var(--f-body);font-size:12px;color:var(--parch-dim)}
/* bottom radial nav */
.m-nav{display:flex;justify-content:space-around;align-items:flex-end;padding:8px 10px 12px;border-top:1px solid var(--line-gold);background:linear-gradient(180deg,rgba(35,29,24,.6),rgba(8,11,32,.9));position:relative}
.m-nav .ni{display:flex;flex-direction:column;align-items:center;gap:4px;font-family:var(--f-mono);font-size:8px;letter-spacing:.06em;color:var(--parch-dim);text-transform:uppercase}
.m-nav .ni.on{color:var(--gold-bright)}
.m-nav .center{margin-top:-24px}
.m-nav .center .orb{width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 40% 35%,var(--gold-bright),var(--gold-deep));display:flex;align-items:center;justify-content:center;box-shadow:0 8px 22px -6px rgba(231,182,75,.7),inset 0 1px 0 rgba(255,255,255,.5);border:2px solid rgba(255,246,223,.3)}
.phone-cap{text-align:center;margin-top:14px;font-family:var(--f-mono);font-size:11px;color:var(--parch-dim);letter-spacing:.06em}
.phone-cap b{color:var(--gold-bright);font-weight:500}

/* footer */
footer{padding:60px 0 80px;text-align:center;border-top:1px solid var(--line-soft)}
footer .fw{font-family:var(--f-display);font-weight:700;font-size:22px;color:var(--gold);letter-spacing:.1em}
footer .fd{font-family:var(--f-deva);font-size:16px;color:var(--parch-dim);margin-top:8px}
footer .fm{font-family:var(--f-mono);font-size:11px;color:var(--parch-dim);letter-spacing:.1em;margin-top:14px}

/* ---------- responsive ---------- */
@media(max-width:1000px){
  .pal-grid{grid-template-columns:repeat(2,1fr)}
  .rationale{grid-template-columns:1fr}
  .tree-wrap{grid-template-columns:1fr}
  .stat-grid{grid-template-columns:1fr}
  .dash-cols{grid-template-columns:1fr}
  .comp-grid .card.span4,.comp-grid .card.span6,.comp-grid .card.span8{grid-column:span 12}
  .practice{grid-template-columns:1fr}
  .p-rail{display:none}
  .p-editor{border-left:0;border-top:1px solid var(--line-soft)}
}
@media(max-width:560px){
  .wrap{padding:0 16px}
  section{padding:48px 0}
  .hero-meta span{font-size:9px;padding:6px 10px}
  .quest .qbody{flex-direction:column;text-align:center}
  .quest .qside{text-align:center}
  .hud{flex-direction:column;text-align:center}
  .streak{flex-wrap:wrap}
  .streak .combo{margin-left:0}
}
</style>

.card.gild{background:radial-gradient(130% 150% at 0% 0%,rgba(217,166,58,.16),transparent 55%),linear-gradient(180deg,#1a2344,#141c38);border:1px solid var(--gold-deep);box-shadow:var(--gild),0 14px 40px -26px #000}
.card.gild .h{color:var(--gold-bright)}.card.gild .b{color:var(--parch-mut)}

.tag{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;padding:3px 9px;border-radius:2px;display:inline-block}
.tag.mastery{color:#231705;background:linear-gradient(180deg,var(--gold-bright),var(--gold));box-shadow:0 2px 8px -2px rgba(217,166,58,.5)}
.tag.info{color:var(--teal-bright);border:1px solid var(--teal);background:rgba(43,154,142,.12)}
.tag.lock{color:var(--parch-dim);border:1px solid var(--hair-2)}
.tag.loss{color:var(--vermilion-2);border:1px solid var(--vermilion-dp);background:rgba(143,39,24,.2)}

.btn{font-family:var(--f-title);font-size:15px;letter-spacing:.04em;padding:12px 24px;border-radius:3px;border:1px solid transparent;cursor:pointer;display:inline-flex;align-items:center;gap:9px;text-decoration:none;transition:.2s}
.btn-gold{color:#231705;background:linear-gradient(180deg,var(--gold-bright),var(--gold) 58%,var(--gold-deep));box-shadow:0 6px 20px -6px rgba(217,166,58,.55),inset 0 1px 0 rgba(255,255,255,.4);border-color:var(--gold-deep)}
.btn-gold:hover{filter:brightness(1.06);transform:translateY(-1px)}
.btn-stone{color:var(--paper);background:linear-gradient(180deg,#2b2620,#1a1610);border:1px solid var(--hair);box-shadow:var(--sh-carve)}
.btn-stone:hover{border-color:var(--gold);color:var(--gold-bright)}
.btn-teal{color:#04211e;background:linear-gradient(180deg,var(--teal-bright),var(--teal));border-color:var(--teal-deep)}
.btn-ghost{color:var(--gold-bright);background:transparent;border-color:var(--gold-deep)}
.btn-ghost:hover{background:rgba(217,166,58,.1)}
.btn-danger{color:var(--vermilion-2);background:transparent;border-color:var(--vermilion-dp)}
.btn-danger:hover{background:rgba(209,63,40,.12)}

.field label{font-family:var(--f-mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);opacity:.82;display:block;margin-bottom:7px}
.inp{width:100%;background:rgba(6,9,20,.6);border:1px solid var(--hair-2);border-radius:3px;padding:11px 13px;color:var(--paper);font-family:var(--f-body);font-size:15px}
.inp:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(217,166,58,.15)}
.inp::placeholder{color:rgba(234,217,182,.4)}

/* quest banner */
.quest{position:relative;border-radius:5px;overflow:hidden;border:1px solid var(--gold-deep);box-shadow:var(--gild)}
.quest .qb{display:flex;gap:20px;align-items:center;padding:22px 26px;background:linear-gradient(115deg,#182147,#20294c 55%,#141a38)}
.quest .qseal{flex:none}
.quest .qtxt{flex:1}
.quest .qk{font-family:var(--f-mono);font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--gold)}
.quest .qt{font-family:var(--f-disp);font-weight:600;font-size:24px;color:var(--paper);line-height:1.1;margin:4px 0 3px}
.quest .qd{font-family:var(--f-serif);font-style:italic;font-size:16px;color:var(--parch-mut)}
.quest .qside{flex:none;text-align:right}
.quest .qr{font-family:var(--f-epic);font-weight:700;font-size:22px;color:var(--gold-bright);font-variant-numeric:tabular-nums}
.quest .qrl{font-family:var(--f-mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--parch-dim)}
.quest .qstrip{height:4px;background:linear-gradient(90deg,var(--vermilion-dp),var(--gold),var(--teal))}

/* mandala HUD ribbon (from C) */
.hud{padding:20px 24px;display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.hud .medallion{flex:none;position:relative;width:100px;height:100px}
.hud .medallion .lv{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.hud .medallion .lv .n{font-family:var(--f-epic);font-weight:800;font-size:32px;color:var(--gold-bright);line-height:1;text-shadow:0 2px 8px rgba(217,166,58,.4)}
.hud .medallion .lv .t{font-family:var(--f-mono);font-size:8px;letter-spacing:.2em;color:var(--parch-dim);margin-top:2px}
.hud .hinfo{flex:1;min-width:200px}
.hud .hname{font-family:var(--f-title);font-size:22px;color:var(--paper);display:flex;align-items:center;gap:10px}
.hud .htitle{font-family:var(--f-serif);font-style:italic;font-size:15px;color:var(--gold-bright);margin:2px 0 12px}
.hud .hstats{display:flex;gap:22px;flex-wrap:wrap;font-family:var(--f-mono);font-size:10.5px;color:var(--parch-dim);letter-spacing:.05em}
.hud .hstats b{display:block;font-family:var(--f-epic);font-weight:700;font-size:19px;color:var(--gold-bright);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.hud .hstats .v b{color:var(--vermilion-2)}
.hud .hstats .t2 b{color:var(--teal-bright)}

/* XP bowstring */
.bow{padding:18px 22px}
.bow .head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px}
.bow .head .l{font-family:var(--f-title);color:var(--paper);font-size:16px}
.bow .head .r{font-family:var(--f-epic);font-weight:700;font-size:15px;color:var(--gold-bright);font-variant-numeric:tabular-nums}
.bow .note{font-family:var(--f-serif);font-style:italic;font-size:13.5px;color:var(--parch-mut);margin:2px 0 8px}

/* streak */
.streak{display:flex;align-items:center;gap:14px;padding:16px 20px;border-radius:5px;border:1px solid var(--vermilion-dp);background:linear-gradient(180deg,#1e1410,#14100c)}
.streak .flame{flex:none}
.streak .n{font-family:var(--f-epic);font-weight:800;font-size:34px;color:var(--gold-bright);line-height:1;font-variant-numeric:tabular-nums}
.streak .l{font-family:var(--f-serif);font-style:italic;color:var(--parch-mut);font-size:14px}
.streak .combo{margin-left:auto;display:flex;gap:5px}
.pip{width:9px;height:9px;border-radius:50%;background:var(--hair-2)}
.pip.on{background:var(--gold-bright);box-shadow:0 0 8px var(--gold)}

/* achievement toast (C sheen) */
.toast{display:flex;gap:15px;align-items:center;padding:15px 19px;border:1px solid var(--gold-deep);border-left:4px solid var(--gold);border-radius:5px;background:linear-gradient(120deg,#1a2244,#141a38);box-shadow:var(--gild);position:relative;overflow:hidden}
.toast::after{content:&quot;&quot;;position:absolute;top:0;left:-45%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,244,216,.22),transparent);animation:sheen 3.4s ease-in-out infinite}
@keyframes sheen{0%,60%{left:-45%}82%,100%{left:130%}}
.toast .badge{flex:none}
.toast .te{font-family:var(--f-mono);font-size:9px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold)}
.toast .tn{font-family:var(--f-title);font-size:17px;color:var(--paper)}
.toast .td{font-family:var(--f-serif);font-style:italic;font-size:14px;color:var(--parch-mut)}

/* level-up ceremony (C rays + bloom + A diya) */
.ceremony{position:relative;min-height:320px;border-radius:6px;overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center;
  background:radial-gradient(circle at center,rgba(34,26,12,.92),var(--void) 72%);border:1px solid var(--gold)}
.rays{position:absolute;top:50%;left:50%;width:560px;height:560px;transform:translate(-50%,-50%);opacity:.5;animation:spin 44s linear infinite}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.cont{position:relative;z-index:2;padding:24px;animation:bloom 1.6s cubic-bezier(.2,.7,.3,1) both}
@keyframes bloom{0%{transform:scale(.5);opacity:0;filter:blur(6px)}56%{transform:scale(1.07)}100%{transform:scale(1);opacity:1;filter:blur(0)}}
.ceremony .ck{font-family:var(--f-mono);font-size:11px;letter-spacing:.4em;text-transform:uppercase;color:var(--teal-bright);margin-bottom:8px}
.ceremony .clv{font-family:var(--f-epic);font-weight:900;font-size:60px;line-height:1;color:transparent;background:linear-gradient(180deg,#fff4d8,var(--gold) 55%,var(--gold-deep));-webkit-background-clip:text;background-clip:text;text-shadow:0 4px 30px rgba(217,166,58,.5)}
.ceremony .cdeva{font-family:var(--f-deva);font-size:22px;color:var(--paper);opacity:.92;margin-top:6px}
.ceremony .ct{font-family:var(--f-serif);font-style:italic;font-size:16px;color:var(--parch-mut);margin-top:8px}
.diya-b{position:absolute;bottom:22px;filter:drop-shadow(0 0 14px rgba(217,166,58,.7));z-index:2}
.diya-b.l{left:16%}.diya-b.r{right:16%}
.flick{animation:flick 1.4s ease-in-out infinite;transform-origin:center bottom}
@keyframes flick{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.14) translateY(-1px);opacity:.86}}

/* loss screen (C cracks + merit restored, NOT dark souls) */
.loss{position:relative;min-height:330px;border-radius:6px;overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center;
  background:radial-gradient(circle at center,rgba(74,18,12,.5),var(--void) 72%);border:1px solid var(--vermilion-dp)}
.loss .lc{position:relative;z-index:2;padding:22px}
.loss .lk{font-family:var(--f-mono);font-size:11px;letter-spacing:.4em;text-transform:uppercase;color:var(--vermilion-2);margin-bottom:12px}
.loss .lbig{font-family:var(--f-epic);font-weight:800;font-size:clamp(28px,4.8vw,50px);line-height:1.05;letter-spacing:.03em;color:transparent;
  background:linear-gradient(180deg,#ffb9ac,var(--vermilion) 60%,var(--vermilion-dp));-webkit-background-clip:text;background-clip:text;text-shadow:0 2px 24px rgba(209,63,40,.4)}
.loss .ldeva{font-family:var(--f-deva);font-size:26px;color:var(--vermilion-2);margin-top:4px}
.loss .lsub{font-family:var(--f-serif);font-style:italic;font-size:17px;color:var(--parch-mut);margin:14px auto 0;max-width:46ch}
.loss .lmerit{margin-top:20px;display:inline-flex;align-items:center;gap:12px;padding:11px 20px;border:1px solid var(--gold);border-radius:4px;background:rgba(217,166,58,.08)}
.loss .lmerit .mn{font-family:var(--f-epic);font-weight:700;font-size:19px;color:var(--gold-bright)}
.loss .lmerit .ml{font-family:var(--f-mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--parch-dim)}
.loss .lmerit .deva{font-family:var(--f-deva);font-size:17px;color:var(--gold)}

/* empty state */
.empty{text-align:center;border-radius:6px;padding:38px 26px;border:1px dashed var(--gold-deep);background:linear-gradient(180deg,var(--panel),var(--night))}
.empty .t{font-family:var(--f-disp);font-weight:600;font-size:22px;color:var(--paper);margin-top:12px}
.empty .b{font-family:var(--f-serif);font-style:italic;color:var(--parch-mut);max-width:44ch;margin:6px auto 16px}

/* ================================================================
   SKILL TREE — forest-map (B) + mandala (C), both shown
   ================================================================ */
.treetabs{display:flex;gap:8px;margin-bottom:16px}
.ttab{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--parch-dim);padding:8px 16px;border:1px solid var(--hair-2);border-radius:3px;background:rgba(6,9,20,.4);cursor:default}
.ttab.on{color:var(--gold-bright);border-color:var(--gold-deep);background:rgba(217,166,58,.1)}
.mapframe{border-radius:6px;overflow:hidden;border:1px solid var(--hair);box-shadow:var(--sh-deep)}
.mapframe svg{display:block;width:100%;height:auto}
.mandala-stage{padding:16px;display:flex;align-items:center;justify-content:center;min-height:520px}
.mandala-stage svg{width:100%;height:auto;max-width:520px}
.petal{cursor:pointer;transition:.25s}
.petal:hover{filter:brightness(1.25) drop-shadow(0 0 10px rgba(217,166,58,.5))}
.track-panel{padding:22px 24px;display:flex;flex-direction:column}
.track-panel .tk{font-family:var(--f-mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--teal-bright)}
.track-panel .tt{font-family:var(--f-disp);font-weight:600;font-size:24px;color:var(--paper);margin:4px 0 2px}
.track-panel .tdeva{font-family:var(--f-deva);font-size:16px;color:var(--gold-bright);margin-bottom:12px}
.tnode{display:flex;gap:13px;align-items:center;padding:12px 0;border-bottom:1px solid var(--hair)}
.tnode:last-child{border-bottom:0}
.dot38{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;position:relative}
.dot38.done{background:radial-gradient(circle,var(--gold-bright),var(--gold-deep));box-shadow:0 0 14px rgba(217,166,58,.5),inset 0 1px 0 rgba(255,255,255,.4)}
.dot38.active{background:radial-gradient(circle,rgba(43,154,142,.5),rgba(17,77,72,.7));border:1.5px solid var(--teal-bright);box-shadow:0 0 14px rgba(43,154,142,.5)}
.dot38.lock{background:var(--loam);border:1px solid var(--hair-2);opacity:.7}
.tninfo{flex:1;min-width:0}
.tnn{font-family:var(--f-title);font-size:16px;color:var(--paper)}
.tnn.lock{color:var(--parch-dim)}
.tnm{font-family:var(--f-mono);font-size:10px;letter-spacing:.05em;color:var(--parch-dim)}
.tnxp{font-family:var(--f-epic);font-weight:700;font-size:13px;color:var(--gold);font-variant-numeric:tabular-nums}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--parch-dim)}
.legend span{display:flex;align-items:center;gap:7px}
.legend i{width:11px;height:11px;border-radius:50%;display:inline-block}

/* ================================================================
   ACTIVITY — diya heatmap + XP curve
   ================================================================ */
.heat{display:grid;grid-template-columns:repeat(26,1fr);gap:5px;margin-top:14px}
.lamp{aspect-ratio:1;border-radius:2px;background:rgba(217,166,58,.06);border:1px solid rgba(217,166,58,.08)}
.lamp.l1{background:rgba(217,166,58,.22);border-color:transparent}
.lamp.l2{background:rgba(217,166,58,.42);box-shadow:0 0 4px rgba(217,166,58,.3);border-color:transparent}
.lamp.l3{background:rgba(217,166,58,.68);box-shadow:0 0 7px rgba(217,166,58,.5);border-color:transparent}
.lamp.l4{background:radial-gradient(circle,var(--gold-bright),var(--gold-deep));box-shadow:0 0 11px rgba(217,166,58,.75);border-color:transparent}
.heat-legend{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:12px;font-family:var(--f-mono);font-size:10px;color:var(--parch-dim)}

/* ================================================================
   KEY SCREENS
   ================================================================ */
.mock{border-radius:8px;overflow:hidden;border:1px solid var(--hair);box-shadow:var(--sh-deep);background:var(--void)}
.mbar{display:flex;align-items:center;gap:12px;padding:10px 16px;background:linear-gradient(180deg,#231d16,#161009);border-bottom:1px solid var(--hair)}
.mbar .dots{display:flex;gap:6px}
.mbar .dots i{width:10px;height:10px;border-radius:50%}
.mbar .dots i:nth-child(1){background:var(--vermilion)}.mbar .dots i:nth-child(2){background:var(--gold)}.mbar .dots i:nth-child(3){background:var(--teal)}
.mbar .brand{font-family:var(--f-epic);font-weight:700;font-size:17px;color:var(--gold-bright);letter-spacing:.05em}
.mnav{display:flex;gap:4px;margin-left:6px}
.mnav a{font-family:var(--f-title);font-size:14px;color:var(--parch-mut);padding:5px 11px;border-radius:3px;text-decoration:none}
.mnav a.on{color:var(--gold-bright);background:rgba(217,166,58,.12);border:1px solid var(--gold-deep)}

.practice{display:grid;grid-template-columns:210px 1fr 300px;min-height:580px;background:radial-gradient(600px 400px at 82% 0%,rgba(43,154,142,.06),transparent),linear-gradient(180deg,var(--night),var(--void))}
.prail{border-right:1px solid var(--hair);padding:18px 14px;display:flex;flex-direction:column;gap:5px;background:rgba(6,9,20,.4)}
.ritem{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:4px;font-family:var(--f-title);font-size:14px;color:var(--parch-mut)}
.ritem.on{background:linear-gradient(90deg,rgba(217,166,58,.15),transparent);color:var(--gold-bright);border-left:2px solid var(--gold)}
.pcenter{display:flex;flex-direction:column;min-height:0}
.pchat{flex:1;padding:22px;display:flex;flex-direction:column;gap:15px}
.msg{max-width:88%;font-size:14.5px;line-height:1.55}
.msg .who{font-family:var(--f-mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;margin-bottom:6px}
.msg.guru{align-self:flex-start}
.msg.guru .bub{background:linear-gradient(180deg,var(--paper),var(--paper-2));color:var(--paper-ink);border:1px solid var(--paper-edge);border-radius:4px 12px 12px 12px;padding:13px 16px;font-family:var(--f-body);box-shadow:var(--sh-deep)}
.msg.guru .who{color:var(--gold-deep)}
.msg.you{align-self:flex-end}
.msg.you .bub{background:rgba(43,154,142,.13);border:1px solid var(--teal);border-radius:12px 4px 12px 12px;padding:13px 16px;color:var(--paper);font-family:var(--f-mono);font-size:13px}
.msg.you .who{color:var(--teal-bright);text-align:right}
.pinput{border-top:1px solid var(--hair);padding:12px 16px;display:flex;gap:10px;align-items:center;background:rgba(6,9,20,.4)}
.pcode{border-left:1px solid var(--hair);background:#080b18;display:flex;flex-direction:column}
.chead{display:flex;align-items:center;gap:8px;padding:9px 14px;background:#0b0f1e;border-bottom:1px solid var(--hair-2);font-family:var(--f-mono);font-size:11.5px;color:var(--parch-dim)}
.editor{flex:1;padding:15px 16px;font-family:var(--f-mono);font-size:12.5px;line-height:1.7;color:#cdd6ff}
.editor .ln{color:#4a5590;user-select:none;display:inline-block;width:20px}
.cfoot{border-top:1px solid var(--hair-2);padding:10px 14px;display:flex;gap:10px;align-items:center;background:#0b0f1e}

.dash{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;padding:18px;background:linear-gradient(180deg,#0e1428,var(--void))}
.stat-big{border-radius:5px;padding:15px 16px;text-align:center;border:1px solid var(--hair-2);background:linear-gradient(180deg,var(--panel),var(--night))}
.stat-big .v{font-family:var(--f-epic);font-weight:700;font-size:32px;color:var(--gold-bright);font-variant-numeric:tabular-nums;line-height:1}
.stat-big .l{font-family:var(--f-mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--parch-dim);margin-top:5px}

/* ================================================================
   MOBILE
   ================================================================ */
.phone{width:340px;margin:0 auto;border-radius:32px;padding:10px;background:linear-gradient(180deg,#05060e,#0a0b16);box-shadow:0 30px 70px -24px #000,0 0 0 2px #2a2f4c}
.phone .screen{border-radius:24px;overflow:hidden;background:var(--night);height:660px;display:flex;flex-direction:column;position:relative}
.notch{height:22px;background:#05060e;position:relative}
.notch::after{content:&quot;&quot;;position:absolute;left:50%;top:6px;transform:translateX(-50%);width:90px;height:6px;border-radius:4px;background:#1a1c30}
.mtop{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--hair);background:#141b32}
.mtop .brand{font-family:var(--f-epic);font-weight:700;color:var(--gold-bright);font-size:16px;letter-spacing:.04em}
.mbody{flex:1;overflow:auto;padding:13px}
.mmsg{border-radius:5px;padding:10px 12px;font-size:13px;margin-bottom:10px;line-height:1.5}
.mmsg.guru{background:linear-gradient(180deg,var(--paper),var(--paper-2));color:var(--paper-ink);font-family:var(--f-body)}
.mmsg.guru .who{font-family:var(--f-mono);font-size:8px;letter-spacing:.18em;color:var(--gold-deep);text-transform:uppercase;display:block;margin-bottom:4px}
.mmsg.you{background:rgba(43,154,142,.14);border:1px solid var(--teal);color:var(--paper);font-family:var(--f-mono);font-size:12px}
.mcode{background:#080b18;border:1px solid var(--hair-2);border-radius:5px;font-family:var(--f-mono);font-size:11px;color:#cdd6ff;padding:10px 12px;line-height:1.6}
.mtabs{display:flex;background:#0b0f1e;border-top:1px solid var(--gold-deep)}
.mtab{flex:1;text-align:center;padding:9px 0 11px;color:var(--parch-dim);font-family:var(--f-mono);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase}
.mtab svg{display:block;margin:0 auto 3px}
.mtab.on{color:var(--gold-bright)}

/* ================================================================
   RESPONSIVE
   ================================================================ */
@media(max-width:900px){
  .g4{grid-template-columns:repeat(2,1fr)}
  .g3{grid-template-columns:1fr}
  .g2{grid-template-columns:1fr}
  .take{grid-template-columns:1fr}
  .outsider{grid-template-columns:1fr}
  .outsider .scene2{min-height:200px}
  .practice{grid-template-columns:1fr}
  .pcode{border-left:0;border-top:1px solid var(--hair)}
  .dash{grid-template-columns:1fr}
  .mnav{display:none}

    <h3>Droṇa turned him away at the door.</h3>
    <p>Ekalavya came to the greatest teacher of the age and was <em>refused</em> — not for want of skill, but for being a forest-born outsider, the wrong caste, from outside the hall.</p>
    <p>So he did not beg. He went into the forest, shaped Droṇa's likeness from clay, and set to work <em>alone</em> — until the day the royal archers found that the boy no one would teach had surpassed them all.</p>
    <p style=&quot;margin-bottom:22px&quot;>This tool is built for that boy. For the economics grad locked out of the CS program. For the career-changer, the self-taught, the one learning it in the forest because the hall was closed. <em>Draw the string.</em></p>

  <h2>Gold for what is earned</h2>
  <p class=&quot;sub&quot;>Warm, temple-lit, earthy — never the AI-neon triad. Indigo-night is warmed toward the forest; gold leaf stays <em>precious</em>, reserved for mastery and the primary path. Each hue carries meaning, never decoration.</p>

<!-- ==================== 2 · TYPE ==================== -->
<section class=&quot;sec&quot;>
  <div class=&quot;eyebrow&quot;><span class=&quot;n&quot;>02</span> Type Specimens</div>
  <h2>Four voices, one manuscript</h2>
  <p class=&quot;sub&quot;><strong>Cinzel</strong> — epic Roman caps for the wordmark, level-ups, big numerals. <strong>Fraunces</strong> — a warm high-contrast display for headings. <strong>Cormorant italic</strong> — the guru's voice. <strong>Spectral</strong> — body. <strong>Tiro Devanagari Hindi</strong> — a genuine Devanagari face. <strong>JetBrains Mono</strong> — code &amp;amp; labels.</p>

<script>
/* ---- diya heatmap ---- */
function fillHeat(id, cols){
  var el=document.getElementById(id); if(!el)return;
  var html='';
  for(var i=0;i<cols*7;i++){
    var r=Math.random(), c='';
    if(r>0.86)c='l4'; else if(r>0.66)c='l3'; else if(r>0.42)c='l2'; else if(r>0.22)c='l1';
    html+='<div class=&quot;lamp '+c+'&quot;></div>';
  }
  el.innerHTML=html;
}
fillHeat('heat',26);
fillHeat('heat2',20);

/* ---- hero mandala petals ---- */
(function(){
  var g=document.getElementById('heropetals'); if(!g)return;
  var n=12,out='';
  for(var i=0;i<n;i++){
    var a=(i/n)*Math.PI*2, a2=((i+0.5)/n)*Math.PI*2;
    var x0=Math.cos(a)*66,y0=Math.sin(a)*66;
    var xt=Math.cos(a2-((0.5/n)*Math.PI*2))*118,yt=Math.sin(a2-((0.5/n)*Math.PI*2))*118;
    var x1=Math.cos(((i+0.7)/n)*Math.PI*2)*66,y1=Math.sin(((i+0.7)/n)*Math.PI*2)*66;
    out+='<path d=&quot;M'+x0.toFixed(1)+' '+y0.toFixed(1)+' Q'+xt.toFixed(1)+' '+yt.toFixed(1)+' '+x1.toFixed(1)+' '+y1.toFixed(1)+' Z&quot;/>';
  }
  g.innerHTML=out;
})();

/* ---- level-up rays ---- */
(function(){
  var g=document.getElementById('rays'); if(!g)return;
  var s='';
  for(var i=0;i<48;i++){
    var a=i*(360/48)*Math.PI/180;
    var x1=100+Math.cos(a)*58,y1=100+Math.sin(a)*58,x2=100+Math.cos(a)*100,y2=100+Math.sin(a)*100;
    s+='<line x1=&quot;'+x1.toFixed(1)+'&quot; y1=&quot;'+y1.toFixed(1)+'&quot; x2=&quot;'+x2.toFixed(1)+'&quot; y2=&quot;'+y2.toFixed(1)+'&quot; opacity=&quot;'+(i%2?.3:.7)+'&quot;/>';
  }
  g.innerHTML=s;
})();

/* ---- loss cracks ---- */
(function(){
  var g=document.getElementById('cracks'); if(!g)return;
  var s='';
  for(var i=0;i<14;i++){
    var a=i*(360/14)*Math.PI/180, r=40+Math.random()*60;
    s+='<line x1=&quot;100&quot; y1=&quot;100&quot; x2=&quot;'+(100+Math.cos(a)*r).toFixed(1)+'&quot; y2=&quot;'+(100+Math.sin(a)*r).toFixed(1)+'&quot;/>';
  }
  g.innerHTML=s;
})();

/* ---- mandala skill tree ---- */
(function(){
  var svg=document.getElementById('mandala'); if(!svg)return;
  var tracks=[
    'gold','gold','gold','teal','gold','gold','dim','gold','gold',
    'teal','dim','gold','dim','teal','gold','dim','dim'
  ];
  var cx=280,cy=280,n=tracks.length,inner=92,plen=168;
  function col(s){return s==='gold'?'#d9a63a':s==='teal'?'#2b9a8e':'#3a2f26';}
  function cb(s){return s==='gold'?'#f4cf76':s==='teal'?'#52cabc':'#5a4a3a';}
  var out='';
  out+='<circle cx=&quot;280&quot; cy=&quot;280&quot; r=&quot;256&quot; fill=&quot;none&quot; stroke=&quot;rgba(217,166,58,.12)&quot; stroke-width=&quot;2&quot;/>';
  out+='<circle cx=&quot;280&quot; cy=&quot;280&quot; r=&quot;256&quot; fill=&quot;none&quot; stroke=&quot;#d9a63a&quot; stroke-width=&quot;3&quot; stroke-dasharray=&quot;'+(2*Math.PI*256*0.53).toFixed(0)+' 9999&quot; stroke-linecap=&quot;round&quot; transform=&quot;rotate(-90 280 280)&quot;/>';
  out+='<circle cx=&quot;280&quot; cy=&quot;280&quot; r=&quot;220&quot; fill=&quot;none&quot; stroke=&quot;rgba(217,166,58,.1)&quot; stroke-width=&quot;1&quot;/>';
  for(var i=0;i<n;i++){
    var a=(i*(360/n)-90)*Math.PI/180, s=tracks[i], c=col(s), cbr=cb(s);
    var x0=cx+Math.cos(a)*inner, y0=cy+Math.sin(a)*inner;
    var xt=cx+Math.cos(a)*(inner+plen), yt=cy+Math.sin(a)*(inner+plen);
    var perp=a+Math.PI/2, w=44;
    var wx=Math.cos(perp)*w, wy=Math.sin(perp)*w;
    var mx=cx+Math.cos(a)*(inner+plen*0.5), my=cy+Math.sin(a)*(inner+plen*0.5);
    var fill=s==='dim'?'rgba(58,47,38,.5)':(s==='teal'?'rgba(43,154,142,.20)':'rgba(217,166,58,.17)');
    out+='<path class=&quot;petal&quot; d=&quot;M'+x0.toFixed(1)+' '+y0.toFixed(1)+' Q'+(mx+wx).toFixed(1)+' '+(my+wy).toFixed(1)+' '+xt.toFixed(1)+' '+yt.toFixed(1)+' Q'+(mx-wx).toFixed(1)+' '+(my-wy).toFixed(1)+' '+x0.toFixed(1)+' '+y0.toFixed(1)+' Z&quot; fill=&quot;'+fill+'&quot; stroke=&quot;'+cbr+'&quot; stroke-width=&quot;'+(s==='dim'?1:1.6)+'&quot;/>';
    var nx=cx+Math.cos(a)*(inner+plen-14), ny=cy+Math.sin(a)*(inner+plen-14);
    out+='<circle cx=&quot;'+nx.toFixed(1)+'&quot; cy=&quot;'+ny.toFixed(1)+'&quot; r=&quot;9&quot; fill=&quot;'+(s==='dim'?'#1a1610':c)+'&quot; stroke=&quot;'+cbr+'&quot; stroke-width=&quot;1.5&quot;/>';
    if(s==='gold') out+='<path d=&quot;M'+(nx-4).toFixed(1)+' '+ny.toFixed(1)+' l3 3 l6 -6&quot; stroke=&quot;#231705&quot; stroke-width=&quot;2&quot; fill=&quot;none&quot; stroke-linecap=&quot;round&quot;/>';
  }
  out+='<circle cx=&quot;280&quot; cy=&quot;280&quot; r=&quot;76&quot; fill=&quot;#101528&quot; stroke=&quot;#f4cf76&quot; stroke-width=&quot;2&quot;/>';
  out+='<circle cx=&quot;280&quot; cy=&quot;280&quot; r=&quot;60&quot; fill=&quot;none&quot; stroke=&quot;#d9a63a&quot; stroke-width=&quot;1&quot; opacity=&quot;.5&quot;/>';
  out+='<path d=&quot;M256 250 C286 268 286 292 256 310&quot; stroke=&quot;#d9a63a&quot; stroke-width=&quot;3&quot; fill=&quot;none&quot; stroke-linecap=&quot;round&quot;/>';
  out+='<line x1=&quot;256&quot; y1=&quot;250&quot; x2=&quot;256&quot; y2=&quot;310&quot; stroke=&quot;#52cabc&quot; stroke-width=&quot;1.4&quot;/>';
  out+='<line x1=&quot;256&quot; y1=&quot;280&quot; x2=&quot;312&quot; y2=&quot;280&quot; stroke=&quot;#f4cf76&quot; stroke-width=&quot;2.5&quot;/>';
  out+='<path d=&quot;M312 280 l-8 -5 M312 280 l-8 5&quot; stroke=&quot;#f4cf76&quot; stroke-width=&quot;2.5&quot; stroke-linecap=&quot;round&quot;/>';
  out+='<text x=&quot;280&quot; y=&quot;336&quot; text-anchor=&quot;middle&quot; fill=&quot;#c3b48f&quot; font-family=&quot;JetBrains Mono&quot; font-size=&quot;11&quot; letter-spacing=&quot;2&quot;>9 / 17</text>';
  svg.innerHTML=out;
})();
