# Ekalavya — nginx reverse proxy + certbot (Let's Encrypt). THIS is the as-built stack
# (see docs/DEPLOY_RUNBOOK.md); the box runs nginx, NOT Caddy.
#
# Install:
#   sudo cp deploy/nginx-eklavya.conf /etc/nginx/sites-available/eklavya
#   sudo ln -s /etc/nginx/sites-available/eklavya /etc/nginx/sites-enabled/eklavya
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d eklavyatheaitutor.duckdns.org   # provisions + wires TLS, auto-renews
#
# Replace the server_name with your domain (point its DNS A record at the static IP first).
# The app binds to 127.0.0.1:4646 only (systemd: eklavya.service); nginx terminates TLS and
# forwards to it. certbot rewrites this file to add the 443 server + cert paths on first run.

server {
    listen 80;
    listen [::]:80;
    server_name eklavyatheaitutor.duckdns.org;

    # certbot manages the TLS server block + HTTP->HTTPS redirect after `certbot --nginx`.

    location / {
        proxy_pass http://127.0.0.1:4646;
        proxy_http_version 1.1;

        # Real client IP for the app's per-IP login throttle (EKLAVYA_TRUST_PROXY=1 trusts these).
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket / streaming (SSE chat) support.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # Security headers (parity with the old Caddy config's #52 header set).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    server_tokens off;
}
